<!doctype html>
<html><head><meta charset="utf-8"><title>Sentinel Eye</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:dark}
body{margin:0;background:#0b0d10;color:#e6e8eb;font:14px system-ui}
header{padding:10px 16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #1e2329}
h1{font-size:16px;margin:0;flex:1}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:6px;padding:6px}
.tile{position:relative;background:#000;aspect-ratio:2/1;cursor:pointer}
.tile span{position:absolute;left:8px;top:6px;z-index:2;background:#000a;padding:2px 6px;border-radius:4px;font-size:12px}
video-stream{display:block;width:100%;height:100%}
video-stream video{width:100%;height:100%;object-fit:contain}
#grid.full{display:block}#grid.full .tile{display:none;aspect-ratio:auto;height:calc(100vh - 60px)}#grid.full .tile.on{display:block}
button{background:#1e2329;color:inherit;border:0;padding:6px 12px;border-radius:6px;cursor:pointer}
</style></head><body>
<header><h1>Sentinel Eye</h1><button id="back" hidden>← Grid</button></header>
<div id="grid"></div>
<script type="module" src="/video-stream.js"></script>
<script>
const grid=document.getElementById('grid'),back=document.getElementById('back');
const wsBase=(location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/api/ws?src=';
customElements.whenDefined('video-stream').then(()=>{
for(let c=1;c<=8;c++){
  const t=document.createElement('div');t.className='tile';
  t.innerHTML=`<span>CH${c}</span>`;
  // <video-stream> only reacts to the src *property*, not the attribute
  const v=document.createElement('video-stream');
  v.mode='webrtc,mse';
  v.src=wsBase+`cam${c}`;
  t.append(v);
  t.onclick=()=>{ if(grid.classList.contains('full'))return;
    grid.classList.add('full');t.classList.add('on');back.hidden=false; };
  grid.append(t);
}
});
back.onclick=()=>{grid.classList.remove('full');back.hidden=true;
  grid.querySelectorAll('.tile.on').forEach(t=>t.classList.remove('on'));};
</script></body></html>
