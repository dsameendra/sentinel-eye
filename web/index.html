<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sentinel Eye</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 108 108'%3E%3Crect x='2' y='2' width='104' height='104' rx='30' fill='%23141417'/%3E%3Ccircle cx='54' cy='54' r='30' fill='none' stroke='%23f5f5f7' stroke-width='7'/%3E%3Ccircle cx='54' cy='54' r='13' fill='%23f5f5f7'/%3E%3Ccircle cx='80' cy='28' r='9' fill='%23ff3b30'/%3E%3C/svg%3E">
<link rel="icon" type="image/png" sizes="192x192" href="icons/app-icon-192.png">
<link rel="stylesheet" href="css/app.css">
<script>try { if (localStorage.getItem('sentinel-eye-tv-mode') === '1') { document.documentElement.classList.add('tv-mode'); var tt = localStorage.getItem('sentinel-eye-tv-theme') || 'dark'; if (tt !== 'auto') document.documentElement.dataset.theme = tt; } } catch (e) { /* private mode */ }</script>
<!-- Installable app (Mac Dock via Safari "Add to Dock" or Chrome/Edge's install button; iPad/iPhone Home
     Screen via Share > Add to Home Screen) — README's "Install as an app" section covers each platform.
     manifest.json + this icon/meta set is what makes the browser offer it and what the installed window
     looks like; sw.js (registered from main.js) is what makes Chrome/Edge actually consider it installable
     at all, not just Safari's older (manifest-independent) Add-to-Home-Screen/Add-to-Dock mechanism. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#09090b">
<link rel="apple-touch-icon" href="icons/app-icon-apple-touch.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sentinel Eye">
<!-- Keep edge-to-edge geometry; the installed app paints matching opaque chrome and reserves
     clearance below the iOS 27 status effect. Metadata alone cannot disable native blur. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="sentinel-shell" content="adaptive-v13">
<script src="js/pwa.js"></script>
</head>
<body>
<div id="statusbar" aria-hidden="true"></div>
<div id="app"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="modal-root"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
