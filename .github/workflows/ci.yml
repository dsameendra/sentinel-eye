name: CI

# Syntax checks for the Python backend and the plain-JS frontend, plus every test suite that needs no real
# recorder: all tools/test_*.py (except test_m0.py, which talks to a real DVR; new test files are picked up
# automatically) and the Node suites for the viewer and the PWA shell. Dependencies come from
# requirements-dev.txt only: the AI enhancer's PyTorch/basicsr stack is not installed (its tests exercise the
# graceful-degradation path), which keeps the job fast and stable. Playback/decrypt against a real DVR can't
# run in CI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    name: Syntax check (Python + JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'   # same minor as the Dockerfile's python:3.14-slim

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python syntax check (app/, tools/)
        run: find app tools -name '*.py' -print -exec python -m py_compile {} +

      - name: JS syntax check (web/)
        run: find web -name '*.js' -print0 | xargs -0 -n1 node --check

  tests:
    name: Recorder-free test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'   # same minor as the Dockerfile's python:3.14-slim

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python dependencies
        run: pip install -q -r requirements-dev.txt

      - name: Python test suites (tools/test_*.py, not test_m0.py)
        run: |
          failed=0
          for t in tools/test_*.py; do
            [ "$t" = tools/test_m0.py ] && continue   # needs a real recorder
            echo "::group::$t"
            if python "$t"; then echo "PASSED $t"; else echo "::error::$t failed"; failed=1; fi
            echo "::endgroup::"
          done
          exit $failed

      - name: Node test suites (viewer, service worker, PWA bootstrap, codecs, event spans)
        run: |
          failed=0
          for t in tools/test_viewer.mjs tools/test_shell_update.mjs tools/test_pwa_bootstrap.mjs tools/test_codecs.mjs tools/test_eventspans.mjs tools/test_exportjobs.mjs; do
            echo "::group::$t"
            if node "$t"; then echo "PASSED $t"; else echo "::error::$t failed"; failed=1; fi
            echo "::endgroup::"
          done
          exit $failed
